[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-dynamics-toolkit"
version = "0.3.0"
description = "车辆动力学工程工具包：SAE J2263 滚动阻力 · BSFC 万有特性 · WLTC 瞬态油耗 · 2-DOF 自行车模型 · CAN 总线仿真"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Young-skyyy"},
]
keywords = [
    "vehicle-dynamics",
    "bsfc",
    "wltc",
    "sae-j2263",
    "can-bus",
    "dbc",
    "bicycle-model",
    "understeer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Young-skyyy/vehicle-dynamics-toolkit"
Repository = "https://github.com/Young-skyyy/vehicle-dynamics-toolkit"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
