[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-dynamics-toolkit"
version = "3.0.1"
description = "Vehicle dynamics toolkit for automotive software testing. Python library + C++ ROS2 nodes: CAN bus simulation, UDS ISO 14229 diagnostics, 2-DOF bicycle model, Pacejka Magic Formula tire model, IDM ACC car-following simulation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Young-skyyy"},
]
keywords = [
    "vehicle-dynamics",
    "can-bus",
    "dbc",
    "uds",
    "iso-14229",
    "bicycle-model",
    "pacejka",
    "understeer",
    "automotive-testing",
    "ros2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
vehicle-dynamics-demo = "vehicle_dynamics_toolkit.__main__:main"

[project.urls]
Homepage = "https://github.com/Young-skyyy/vehicle-dynamics-toolkit"
Repository = "https://github.com/Young-skyyy/vehicle-dynamics-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
