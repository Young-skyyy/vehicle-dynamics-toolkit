name: pytest

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests
        run: python -m pytest test_vehicle_dynamics.py test_can_demo.py test_uds.py test_can_bus_load.py -v
