name: pytest + mypy

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests
        run: python -m pytest test_vehicle_dynamics.py test_can_demo.py test_uds.py test_can_bus_load.py -v

  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install mypy
        run: pip install mypy

      - name: Type check
        run: python -m mypy --ignore-missing-imports vehicle.py lateral_dynamics.py bsfc.py wltc.py uds.py can_demo.py can_bus_load_demo.py
