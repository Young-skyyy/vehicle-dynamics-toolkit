name: test + mypy + ROS2

on: [push, pull_request]

jobs:
  # ── Python 测试 ──
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: pip install -e ".[test]"

      - name: Run all tests
        run: python -m pytest tests/ -v

  # ── mypy 类型检查 ──
  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install mypy
        run: pip install mypy

      - name: Type check
        run: |
          python -m mypy --platform linux --ignore-missing-imports src/vehicle_dynamics_toolkit/
          python -m mypy --platform win32 --ignore-missing-imports src/vehicle_dynamics_toolkit/

  # ── 真正编译、运行、逐样本比较 C++ 与 Python ──
  dynamics-parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: pip install -e .

      - name: Compile and compare the ROS2 dynamics core
        run: python scripts/compare_py_cpp.py --check

      - name: Verify physics against independent analytical solutions
        run: python scripts/validate_physics.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytical-physics-report
          path: build/physics/report.json

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamics-parity
          path: build/parity/*.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamics-parity-report
          path: build/parity/report.json

  # ── ROS2 C++ 编译 ──
  ros2-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        run: |
          sudo apt update && sudo apt install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt update
          sudo apt install -y ros-humble-ros-base ros-humble-ament-lint-auto ros-humble-ament-lint-common python3-colcon-common-extensions

      - name: Build ROS2 packages
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --symlink-install --packages-up-to vehicle_dynamics_node uds_server

      - name: Verify binaries exist
        run: |
          test -x ros2_ws/install/vehicle_dynamics_node/lib/vehicle_dynamics_node/dynamics_node
          test -x ros2_ws/install/vehicle_dynamics_node/lib/vehicle_dynamics_node/dynamics_runner
          test -x ros2_ws/install/uds_server/lib/uds_server/uds_server_node

      - name: Compare the runner built by the ROS2 package
        run: |
          python3 -m pip install .
          python3 scripts/compare_py_cpp.py --check --runner ros2_ws/install/vehicle_dynamics_node/lib/vehicle_dynamics_node/dynamics_runner --output build/ros2-parity

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-parity-report
          path: build/ros2-parity/report.json

  wheel-fmu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Compile and exercise FMU outside source checkout
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/scripts/check_fmu_install.py" --require-installed --compiler c++ --output "$GITHUB_WORKSPACE/build/fmu/report.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-fmu-can-uds-report
          path: build/fmu/report.json

      - name: Run the installed end-to-end showcase
        run: |
          cd "$(mktemp -d)"
          python -m vehicle_dynamics_toolkit.showcase --with-fmu --compiler c++ --output "$GITHUB_WORKSPACE/build/showcase"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-showcase
          path: build/showcase/
